name: Run trends pipeline (weekly, no trending score)

on:
  schedule:
    - cron: "23 9 * * 5" # Fridays at 09:23 UTC (4 days after Monday)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMPUTE_TRENDING_SCORE: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python backend/run.py
      - name: Update heartbeat
        env:
          HEARTBEAT_FILE: .github/heartbeat/run-weekly-without-trend-score.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.environ["HEARTBEAT_FILE"]
          os.makedirs(os.path.dirname(path), exist_ok=True)

          def github_int(name):
              value = os.environ.get(name, "")
              return int(value) if value.isdigit() else value

          payload = {
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "last_success_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "run_id": github_int("GITHUB_RUN_ID"),
              "run_number": github_int("GITHUB_RUN_NUMBER"),
              "ref_name": os.environ["GITHUB_REF_NAME"],
              "sha": os.environ["GITHUB_SHA"],
          }

          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HEARTBEAT_FILE"
          git commit -m "Update ${GITHUB_WORKFLOW} heartbeat"
          git push origin "HEAD:${GITHUB_REF_NAME}"
